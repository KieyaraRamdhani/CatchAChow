name: catch_a_chow
description: CatchAChow South African student food-budgeting and meal-planning app.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - data/products.json
    - data/recipes.json
    - assets/images/
    - .env
